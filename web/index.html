<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Dashboard</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151c2c;
            --accent: #38bdf8;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 18px 24px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; }
        h1 { margin: 0; font-size: 1.5em; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; padding: 8px 14px; border-radius: 6px; background: #0f172a; transition: color 0.2s; }
        .nav-links a:hover { color: #fff; background: var(--border); }
        .badge { background: #334155; color: #94a3b8; font-weight: bold; padding: 4px 10px; border-radius: 12px; font-size: 0.85em; text-transform: uppercase; }
        .badge.live { background: #052e16; color: var(--accent-green); border: 1px solid var(--accent-green); }

        .section-title { font-size: 1.2em; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
        
        .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 36px; }
        .match-card { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border); padding: 20px; transition: transform 0.2s, border-color 0.2s; cursor: pointer; position: relative; overflow: hidden; }
        .match-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .match-card.active { border-color: var(--accent-green); }
        .match-meta { display: flex; justify-content: space-between; font-size: 0.85em; color: var(--text-muted); margin-bottom: 12px; }
        .teams-title { font-size: 1.25em; font-weight: 700; margin-bottom: 12px; }
        .score-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
        .score-big { font-size: 2.2em; font-weight: 800; color: var(--accent); }
        .overs-info { font-size: 1em; color: var(--text-muted); }
        .card-actions { display: flex; gap: 8px; margin-top: 16px; }
        .btn-sub { flex: 1; padding: 8px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; background: #0284c7; color: white; }
        .btn-sub.subscribed { background: #059669; }

        /* Detail Panel */
        .detail-panel { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 28px; margin-top: 24px; display: none; }
        .detail-panel.open { display: block; animation: slideDown 0.3s ease; }
        .detail-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .stats-table th, .stats-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.95em; }
        .stats-table th { color: var(--text-muted); font-size: 0.85em; text-transform: uppercase; }

        .comm-timeline { max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 6px; }
        .comm-entry { background: #0f172a; padding: 12px 16px; border-radius: 8px; border-left: 4px solid var(--accent); font-size: 0.95em; }
        .comm-entry.wicket { border-left-color: #ef4444; background: #2a1215; }
        .comm-entry.boundary { border-left-color: var(--accent-green); }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏏 Live Sports Match Center</h1>
            <div class="nav-links">
                <span id="connBadge" class="badge">OFFLINE (STATIC)</span>
                <a href="/index.html" style="color: var(--accent);">Dashboard</a>
                <a href="/admin.html">Admin Console</a>
            </div>
        </header>

        <div class="section-title">Matches Directory</div>
        <div id="matchesGrid" class="matches-grid">
            <div style="color: var(--text-muted); padding: 20px;">Loading matches...</div>
        </div>

        <div id="detailPanel" class="detail-panel">
            <div class="detail-header">
                <div>
                    <h2 id="detailTitle" style="margin: 0; color: var(--accent);">Match Details</h2>
                    <span id="detailVenue" style="color: var(--text-muted); font-size: 0.9em;"></span>
                </div>
                <button onclick="closeDetail()" style="background: #334155; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Close ✖</button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div>
                    <h3 style="margin-top: 0; color: var(--text-muted); font-size: 0.9em; text-transform: uppercase;">Current Innings Scorecard</h3>
                    <div style="background: #0f172a; padding: 20px; border-radius: 10px; margin-bottom: 16px;">
                        <div id="detailScore" style="font-size: 3em; font-weight: 800; color: var(--accent);">0/0</div>
                        <div id="detailOvers" style="color: var(--text-muted);">Overs: 0.0</div>
                    </div>
                    <table class="stats-table">
                        <thead>
                            <tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr>
                        </thead>
                        <tbody id="battersTable">
                            <tr><td colspan="5" style="color: var(--text-muted);">No batter data yet</td></tr>
                        </tbody>
                    </table>
                </div>

                <div>
                    <h3 style="margin-top: 0; color: var(--text-muted); font-size: 0.9em; text-transform: uppercase;">Live Commentary Stream</h3>
                    <div id="commTimeline" class="comm-timeline">
                        <div style="color: var(--text-muted);">Subscribe to stream commentary...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const matchStateMap = new Map();
        const subscribedMatches = new Set();
        let selectedMatchID = null;
        let ws = null;

        async function init() {
            // Render initial snapshot via REST API (No WebSocket connection established on load)
            await fetchMatches();
        }

        async function fetchMatches() {
            try {
                const res = await fetch('/api/matches');
                let matches = await res.json();
                
                if (!matches || matches.length === 0) {
                    matches = [{
                        id: 'match-001',
                        team_a: { name: 'India' },
                        team_b: { name: 'Australia' },
                        format: 'T20',
                        venue: 'MCG, Melbourne'
                    }];
                }

                // Fetch latest REST state snapshot for each match
                for (const m of matches) {
                    try {
                        const sRes = await fetch(`/matches/${m.id}`);
                        if (sRes.ok) {
                            const data = await sRes.json();
                            if (data && data.innings) {
                                matchStateMap.set(m.id, data.innings);
                            }
                        }
                    } catch (e) {}
                }

                renderMatchesGrid(matches);
            } catch (err) {
                console.error("Failed to load matches", err);
            }
        }

        function renderMatchesGrid(matches) {
            const grid = document.getElementById('matchesGrid');
            grid.innerHTML = matches.map(m => {
                const state = matchStateMap.get(m.id) || { runs: 0, wickets: 0, overs: 0, ball_in_over: 0 };
                const isSubbed = subscribedMatches.has(m.id);
                return `
                    <div class="match-card ${isSubbed ? 'active' : ''}" onclick="selectMatch('${m.id}', '${m.team_a?.name || 'Team A'} vs ${m.team_b?.name || 'Team B'}', '${m.venue || ''}')">
                        <div class="match-meta">
                            <span>${m.format || 'LIVE'} • ${m.venue || 'Stadium'}</span>
                            <span>ID: ${m.id}</span>
                        </div>
                        <div class="teams-title">${m.team_a?.name || 'Team A'} vs ${m.team_b?.name || 'Team B'}</div>
                        <div class="score-row">
                            <div class="score-big" id="score-${m.id}">${state.runs || 0}/${state.wickets || 0}</div>
                            <div class="overs-info" id="overs-${m.id}">Overs: ${state.overs || 0}.${state.ball_in_over || 0}</div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-sub ${isSubbed ? 'subscribed' : ''}" onclick="event.stopPropagation(); toggleSub('${m.id}')">
                                ${isSubbed ? '✓ Subscribed (Live)' : '+ Subscribe Live'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleSub(matchID) {
            if (subscribedMatches.has(matchID)) {
                subscribedMatches.delete(matchID);
            } else {
                subscribedMatches.add(matchID);
            }

            if (subscribedMatches.size > 0) {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    connectWS();
                }
            } else {
                if (ws) {
                    ws.close();
                    ws = null;
                }
                updateConnBadge(false);
            }

            fetchMatches();
        }

        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws?match_id=all`);

            ws.onopen = () => {
                updateConnBadge(true);
            };

            ws.onmessage = (event) => {
                try {
                    const env = JSON.parse(event.data);
                    if (!env.payload) return;

                    // Only process updates for subscribed matches
                    if (!subscribedMatches.has(env.match_id) && env.match_id !== 'all') {
                        return;
                    }

                    if (env.type === 'state') {
                        const st = env.payload.innings || {};
                        matchStateMap.set(env.match_id, st);
                        updateCardScore(env.match_id, st);
                        if (selectedMatchID === env.match_id) {
                            updateDetailView(st);
                        }
                    } else if (env.type === 'commentary' && selectedMatchID === env.match_id) {
                        appendCommentary(env.payload);
                    }
                } catch (e) {
                    console.error("WS parse error", e);
                }
            };

            ws.onclose = () => {
                updateConnBadge(false);
                if (subscribedMatches.size > 0) {
                    setTimeout(connectWS, 3000);
                }
            };
        }

        function updateConnBadge(isLive) {
            const badge = document.getElementById('connBadge');
            if (isLive) {
                badge.textContent = 'WS LIVE STREAMING';
                badge.classList.add('live');
            } else {
                badge.textContent = 'OFFLINE (STATIC)';
                badge.classList.remove('live');
            }
        }

        function updateCardScore(matchID, st) {
            const scoreEl = document.getElementById(`score-${matchID}`);
            const oversEl = document.getElementById(`overs-${matchID}`);
            if (scoreEl) scoreEl.textContent = `${st.runs || 0}/${st.wickets || 0}`;
            if (oversEl) oversEl.textContent = `Overs: ${st.overs || 0}.${st.ball_in_over || 0}`;
        }

        async function selectMatch(matchID, title, venue) {
            selectedMatchID = matchID;
            document.getElementById('detailTitle').textContent = title;
            document.getElementById('detailVenue').textContent = venue;
            document.getElementById('detailPanel').classList.add('open');

            // Subscribe if not already
            if (!subscribedMatches.has(matchID)) {
                toggleSub(matchID);
            }

            // Immediately load snapshot via REST
            try {
                const sRes = await fetch(`/matches/${matchID}`);
                if (sRes.ok) {
                    const data = await sRes.json();
                    if (data && data.innings) {
                        matchStateMap.set(matchID, data.innings);
                        updateDetailView(data.innings);
                    }
                }
            } catch (e) {}

            const st = matchStateMap.get(matchID);
            if (st) updateDetailView(st);
        }

        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('open');
            selectedMatchID = null;
        }

        function updateDetailView(st) {
            document.getElementById('detailScore').textContent = `${st.runs || 0}/${st.wickets || 0}`;
            document.getElementById('detailOvers').textContent = `Overs: ${st.overs || 0}.${st.ball_in_over || 0}`;

            const tbody = document.getElementById('battersTable');
            if (st.batters && Object.keys(st.batters).length > 0) {
                tbody.innerHTML = Object.values(st.batters).map(b => `
                    <tr>
                        <td><strong>${b.player?.name || 'Batter'}</strong></td>
                        <td>${b.runs}</td>
                        <td>${b.balls}</td>
                        <td>${b.fours}</td>
                        <td>${b.sixes}</td>
                    </tr>
                `).join('');
            }
        }

        function appendCommentary(c) {
            const container = document.getElementById('commTimeline');
            const entry = document.createElement('div');
            const isWicket = c.text && c.text.includes('OUT');
            const isBoundary = c.text && (c.text.includes('FOUR') || c.text.includes('SIX'));

            entry.className = `comm-entry ${isWicket ? 'wicket' : isBoundary ? 'boundary' : ''}`;
            entry.innerHTML = `<strong>${c.over}.${c.ball}</strong> — ${c.text}`;
            container.insertBefore(entry, container.firstChild);
        }

        init();
    </script>
</body>
</html>
